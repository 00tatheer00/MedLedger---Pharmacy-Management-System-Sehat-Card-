<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — MedLedger DHQ Kohat</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: #1e293b;
        border: 2px solid #334155;
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem;
        background: rgba(13, 148, 136, 0.2);
        border: 2px solid #0d9488;
        border-radius: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 0.5rem;
      }
      .urdu {
        font-size: 1rem;
        font-weight: 700;
        color: #14b8a6;
        margin-bottom: 1rem;
      }
      p {
        font-size: 0.875rem;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 1.5rem;
      }
      .badge {
        display: inline-block;
        background: rgba(245, 158, 11, 0.2);
        border: 1px solid #f59e0b;
        color: #fde68a;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      button {
        background: #0d9488;
        color: #ffffff;
        border: none;
        padding: 0.75rem 1.75rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
        width: 100%;
      }
      button:hover {
        background: #0f766e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🏥</div>
      <span class="badge">Offline Mode • انٹرنیٹ منقطع</span>
      <h1>Hospital Connection Offline</h1>
      <div class="urdu">انٹرنیٹ کنکشن دستیاب نہیں ہے</div>
      <p>
        You are currently disconnected from the hospital network. Cached records and pharmacy
        counter templates will resume syncing once connection is restored.
      </p>
      <button onclick="window.location.reload()">Retry Connection (دوبارہ کوشش کریں)</button>
    </div>
  </body>
</html>
